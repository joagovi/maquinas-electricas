project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "teoria/**/*.qmd"
    - "dirigidas/**/*.qmd"
    - "laboratorios/**/*.qmd"
    - "exposiciones/**/*.qmd"
    - "gestion/**/*.qmd"
    - "!_entrada/**"
    - "!legacy/**"
    - "!docs/**"

website:
  title: "IEE2A5 — Máquinas Eléctricas"
  description: "Material del curso. PUCP, Facultad de Ciencias e Ingeniería."
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: gestion/calendario.qmd
        text: Calendario
      - text: Clases
        menu:
          - href: teoria/cap1-circuitos-magneticos/index.qmd
            text: "Sesión 1 — Circuitos magnéticos"
      - text: Dirigidas
        menu:
          - href: dirigidas/pd1-femm/index.qmd
            text: "PD1 — Circuitos magnéticos (FEMM)"
      - text: Laboratorios
        menu:
          - href: laboratorios/lab1/index.qmd
            text: "Lab 1 — Motor DC"
          - href: laboratorios/lab2/index.qmd
            text: "Lab 2 — Máquina síncrona"
          - href: laboratorios/lab4/index.qmd
            text: "Lab 4 — Máquina asíncrona"
          - href: laboratorios/lab5/index.qmd
            text: "Lab 5 — Métodos de arranque"
      - href: exposiciones/reglas.qmd
        text: Exposiciones
      - href: gestion/responsables.qmd
        text: Horarios
  page-footer:
    center: "Material del curso IEE2A5. Generado desde el repositorio — no editar los PDF a mano."

format:
  html:
    theme: cosmo
    toc: true
    lang: es

  pdf:
    documentclass: article
    papersize: a4
    lang: es
    fontsize: 11pt
    # Liberation Sans es metricamente compatible con Arial: reproduce el aspecto
    # de los documentos PUCP en Word en vez del serif clasico de LaTeX.
    mainfont: "Liberation Sans"
    monofont: "Liberation Mono"
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.5cm
      - right=2.5cm
    include-in-header: _templates/fci-header.tex
    template-partials:
      - _templates/title.tex
      - _templates/before-body.tex
    # Valores por defecto; cada documento puede sobreescribirlos
    curso: "MÁQUINAS ELÉCTRICAS"
    cuestionario: true
    keep-tex: false
